[project]
name = "marketlens"
version = "0.2.0"
description = "Market research and portfolio toolkit on yfinance, with a Claude Code plugin and MCP server."
readme = "README.md"
license = "MIT"
authors = [{ name = "Lisa Perrin" }]
requires-python = ">=3.12"
keywords = ["finance", "stocks", "yfinance", "mcp", "claude-code"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Financial and Insurance Industry",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
  "yfinance>=1.0",
  "pandas>=2.2",
  "typer>=0.15",
  "rich>=13.0",
  "mcp>=2.0",
]

[project.scripts]
marketlens = "marketlens.cli:app"
marketlens-mcp = "marketlens.mcp_server:main"

[project.urls]
Repository = "https://github.com/lisaperrin/marketlens"

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.8",
  "mypy>=1.13",
  "pandas-stubs>=2.2",
]

[build-system]
requires = ["uv_build>=0.8,<1"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "RUF", "D"]
ignore = ["D100", "D104", "D107", "D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
"scripts/**" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src"]
plugins = []

[[tool.mypy.overrides]]
module = ["yfinance", "yfinance.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = ["error"]

[tool.coverage.run]
source = ["marketlens"]
